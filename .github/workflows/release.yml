name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zip libglib2.0-bin jq make

      - name: Build extension zip
        run: make zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: promptkey@drowhann.github.io.shell-extension.zip
          generate_release_notes: true

      - name: Upload to extensions.gnome.org
        env:
          EGO_USERNAME: ${{ secrets.EGO_USERNAME }}
          EGO_PASSWORD: ${{ secrets.EGO_PASSWORD }}
        run: |
          if [ -z "${EGO_USERNAME:-}" ] || [ -z "${EGO_PASSWORD:-}" ]; then
            echo "Missing secrets EGO_USERNAME / EGO_PASSWORD."
            echo "Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          ./scripts/ego-upload.sh promptkey@drowhann.github.io.shell-extension.zip
